# Disposable test infrastructure only. Never use these credentials outside local tests.
# Pass a unique -p project name to isolate this stack from other worktrees.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: selene_test
      POSTGRES_USER: selene_test
      POSTGRES_PASSWORD: selene_local_test_only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${SELENE_TEST_PG_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selene_test -d selene_test']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
volumes:
  postgres-test-data: {}
