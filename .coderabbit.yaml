# CodeRabbit pull request reviews. Reference: https://docs.coderabbit.ai/reference/configuration
# Settings not listed here keep CodeRabbit's defaults. Review rules come from the
# guideline files below, so do not copy them into path_instructions.
language: en-US

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target the branch below them, not main; review every base branch.
    base_branches:
      - '.*'
  # CodeRabbit is a required check on main: a review that errors must block the merge
  # instead of ending neutral. Rate-limited reviews still pass; rerun with
  # `@coderabbitai review`.
  fail_commit_status: true
  # Generated files, lockfiles, and HTML mockups: reviewing them is noise.
  path_filters:
    - '!packages/types/src/database.types.ts'
    - '!bun.lock'
    - '!supabase/functions/deno.lock'
    - '!design/**'

knowledge_base:
  code_guidelines:
    enabled: true
    # Added to CodeRabbit's default guideline files (which include the root AGENTS.md).
    filePatterns:
      - '**/AGENTS.md'
      - 'docs/conventions.md'
