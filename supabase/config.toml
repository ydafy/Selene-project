# Supabase project configuration tracked for deployment-critical function flags.
# Every function has an entry with `verify_jwt = false` and authenticates its caller in
# code (#399): the gateway check only understands the legacy JWT keys, so it must be off
# before the project rotates to asymmetric JWT signing keys (#337). A function missing
# here would deploy with the default `verify_jwt = true`.
# `supabase/functions/_shared/__tests__/auth-in-code.test.ts` enforces both rules.

# Public HTTPS redirect bridge used by Stripe Account Links. Stripe cannot send
# Supabase JWT headers to return_url/refresh_url; it only redirects to configured
# deep links and reads no data, so it checks no caller.
[functions.connect-onboarding-return]
verify_jwt = false

# Envia tracking webhook; Envia does not send Supabase JWTs. Authenticated by the
# Envia webhook signature (`_shared/envia/envia-webhook-verify.ts`).
[functions.envia-webhook]
verify_jwt = false

# Stripe webhook endpoint; authenticated by the `stripe-signature` header.
[functions.stripe-webhooks]
verify_jwt = false

# Cron-invoked worker; authenticated by the `x-cron-secret` header.
[functions.resume-pending-payouts]
verify_jwt = false

# Cron-invoked; authenticated by the `x-cron-secret` header.
[functions.checkout-recovery-worker]
verify_jwt = false

# Cron-invoked; authenticated by the `x-cron-secret` header.
[functions.reconcile-stripe-fees]
verify_jwt = false

# Cron-invoked; authenticated by the `x-cron-secret` header.
[functions.complete-delivered-shipments]
verify_jwt = false

# Cron-invoked; authenticated by the `x-cron-secret` header.
[functions.auto-cancel-orders]
verify_jwt = false

# Cron-invoked; authenticated by the `x-cron-secret` header.
[functions.auto-cancel-preparing]
verify_jwt = false

# Cron-invoked tracking poller; authenticated by `Authorization: Bearer
# <TRACK_SHIPMENTS_CRON_SECRET>`.
[functions.track-shipments]
verify_jwt = false

# Cron-invoked health watchdog; authenticated by the `x-cron-secret` header.
[functions.cron-watchdog]
verify_jwt = false

# Cron-invoked retry of the Stripe and Storage cleanup of closed accounts; authenticated
# by the `x-cron-secret` header.
[functions.account-closure-cleanup]
verify_jwt = false

# Cron-invoked delivery of queued push notifications through Expo; authenticated by the
# `x-cron-secret` header.
[functions.dispatch-push]
verify_jwt = false

# Self-service account closure: auth.getUser verifies the caller's access token, and the
# function also requires a sign-in newer than 10 minutes.
[functions.delete-account]
verify_jwt = false

# Admin-invoked: auth.getUser verifies the caller's access token, and the function then
# checks profiles_private.role = 'admin'.
[functions.resolve-shipment-refund]
verify_jwt = false

# Admin-invoked list of unresolved refund problems; same admin check as resolve-shipment-refund.
[functions.list-shipment-refund-problems]
verify_jwt = false

# Admin "Envios" queue (preparing-timeout cancellations under carrier review): list and decision;
# same admin check as the refund pair. The late carrier activity and label reconciliation
# pairs below use the same check.
[functions.list-shipment-operation-reviews]
verify_jwt = false

[functions.resolve-shipment-operation-review]
verify_jwt = false

[functions.list-shipment-late-carrier-activity]
verify_jwt = false

[functions.acknowledge-shipment-late-carrier-activity]
verify_jwt = false

[functions.list-shipment-label-reconciliations]
verify_jwt = false

[functions.resolve-shipment-label-reconciliation]
verify_jwt = false

# Admin-invoked; auth.getUser verifies the caller's access token, then the function checks
# the admin role.
[functions.get-connect-payout-release-queue]
verify_jwt = false

[functions.reconcile-connect-payments]
verify_jwt = false

[functions.release-connect-payout]
verify_jwt = false

[functions.resolve-dispute]
verify_jwt = false

# Signed-in user calls (from the app, and for some from the admin-web); auth.getUser verifies
# the caller's access token, so a missing token or the anon key gets no user and the call is
# rejected. Functions shared with the admin-web check the role in code.
[functions.cancel-order]
verify_jwt = false

[functions.confirm-shipment-delivery]
verify_jwt = false

[functions.create-connect-account]
verify_jwt = false

[functions.create-connect-payment]
verify_jwt = false

[functions.create-dispute]
verify_jwt = false

[functions.create-return-intent]
verify_jwt = false

[functions.generate-return-label]
verify_jwt = false

[functions.generate-shipping-label]
verify_jwt = false

[functions.get-seller-onboarding]
verify_jwt = false

[functions.get-shipping-quote]
verify_jwt = false

[functions.manage-payment-methods]
verify_jwt = false

[functions.refresh-connect-account-status]
verify_jwt = false

[functions.resolve-dispute-refund]
verify_jwt = false

[functions.resolve-shipment-tracking-url]
verify_jwt = false

[functions.rollback-connect-payment]
verify_jwt = false

# Local Auth mirrors the deployed settings of project acoiclkeymgtlwcxilun so the
# signup flow (confirmation code, password policy) behaves the same locally.
# Google sign-in is not configured locally: it needs client secrets. "Require
# current password when updating" has no CLI key and stays off until block 4.
# Manual identity linking is disabled; Supabase links by verified email.
[auth]
enable_signup = true
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

# Mirrors the remote rate limits. The CLI only applies `email_sent` with custom
# SMTP, so it is inert on the local mail catcher.
[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

# CAPTCHA is on locally so the local stack exercises the same token path as production,
# which turns it on in the Dashboard at launch (docs/go-live.md section 10). The secret is
# hCaptcha's public TEST secret, not a credential: with it Auth accepts the test response
# token 10000000-aaaa-bbbb-cccc-000000000001 (site key 10000000-ffff-ffff-ffff-000000000001).
# Production uses the real hCaptcha secret from the Dashboard; never `supabase config push`
# this file to the remote, or the test secret would replace it. Every local caller of a guarded
# endpoint (/signup, /recover, /resend, /magiclink, /otp, /token?grant_type=password) sends
# that token as gotrue_meta_security.captcha_token (Bruno `captchaToken`; local admin-web E2E).
[auth.captcha]
enabled = true
provider = "hcaptcha"
secret = "0x0000000000000000000000000000000000000000"

# Mirrors the remote email provider: signup on, confirmation code required,
# secure email change on, secure password change off (the password change is
# proven with the current password instead; "Require current password" is a
# Dashboard-only setting with no config key), 6-digit code valid for 15 minutes.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 900
# The local mail catcher uses the default link template: experimental stack
# mode does not serve custom templates (content_path), so locally a signup is
# confirmed through the link's token_hash. The 6-digit code flow is proven on
# the remote project, whose Dashboard template sends {{ .Token }}.

# Branded Spanish templates (supabase/templates/, go-live section 10), left
# commented out: the experimental stack above refuses them at `supabase start`
# ("content_path requires template serving, which is not supported by the
# experimental stack"). To preview them locally, uncomment this block and run
# `SUPABASE_EXPERIMENTAL_STACK=0 supabase start` (legacy stack, fixed ports): the
# signup mail then carries the 6-digit code. Never commit it uncommented.
# [auth.email.template.confirmation]
# subject = "Tu código de confirmación de Selene"
# content_path = "./supabase/templates/confirmation.html"
#
# [auth.email.template.recovery]
# subject = "Restablece tu contraseña de Selene"
# content_path = "./supabase/templates/recovery.html"
#
# [auth.email.template.email_change]
# subject = "Confirma el cambio de correo en Selene"
# content_path = "./supabase/templates/email_change.html"
#
# [auth.email.template.reauthentication]
# subject = "Tu código de verificación de Selene"
# content_path = "./supabase/templates/reauthentication.html"

# Edge Functions run on the Supabase Edge Runtime, not the local Deno CLI.
# Pin its Deno major so local serve matches the hosted runtime.
[edge_runtime]
deno_version = 2

# Per-worktree local projects: `supabase start` assigns each worktree (and
# branch) its own ports and data, so several worktrees can run at once.
# Experimental in the CLI; set SUPABASE_EXPERIMENTAL_STACK=0 to fall back.
[experimental]
stack = true

# Declarative schemas: supabase/schemas/ is the source of truth for the schema and
# `supabase db schema declarative sync` writes each migration (supabase/AGENTS.md).
[experimental.pgdelta]
enabled = true
