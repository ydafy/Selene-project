# Weekly dependency report (docs/dependencies.md).
# Writes scripts/ci/dependency-report.ts output into one open issue titled
# "Reporte de dependencias" and comments the summary line, so the maintainer gets
# an email. It never opens pull requests and never changes dependencies.
name: Dependency report

on:
  schedule:
    # Off the top and half hour, where GitHub most often delays or drops scheduled runs.
    - cron: '47 14 * * 1' # Mondays 14:47 UTC (08:47 in Mexico City), after the dependency audit
    # Backup, after the audit's backup: runs the report only when no other scheduled
    # run started in the last 24 hours (scripts/ci/scheduled-backup.ts). Keep it
    # equal to BACKUP_CRON below.
    - cron: '53 20 * * 1' # Mondays 20:53 UTC (14:53 in Mexico City)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-report

env:
  BACKUP_CRON: '53 20 * * 1'

jobs:
  # Every trigger except the backup cron always runs the report.
  should-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: bun scripts/ci/scheduled-backup.ts dependency-report.yml "$BACKUP_CRON"

  report:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Reporte de dependencias
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # `npx expo install --check` runs on Node; use the repository's version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The report reads the installed Expo SDK, and `expo install --check` needs it.
      - run: bun install --frozen-lockfile
      # Exit 1 means a check could not run; publish the report anyway, then fail.
      - id: report
        run: |
          set +e
          bun scripts/ci/dependency-report.ts > report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Update the report issue
        run: |
          # A crashed script must not wipe the last good report.
          if [ ! -s report.md ]; then
            echo "::error::The report is empty; the issue was not changed."
            exit 1
          fi
          # Only the issue this workflow created: anyone can open one with the same title.
          number=$(gh issue list --state open --author app/github-actions \
            --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -z "$number" ]; then
            url=$(gh issue create --title "$TITLE" --body-file report.md)
            number=${url##*/}
          else
            gh issue edit "$number" --body-file report.md
          fi
          summary=$(sed -n '3p' report.md)
          gh issue comment "$number" --body "Updated report: $summary"
      - if: steps.report.outputs.exit != '0'
        run: |
          echo "::error::A dependency check could not run; see 'Could not check' in the report."
          exit 1
