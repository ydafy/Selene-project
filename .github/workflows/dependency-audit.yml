# Weekly dependency vulnerability audit.
# Dependabot alerts only see direct dependencies in package.json; bun audit reads
# bun.lock, so it also covers transitive dependencies. Fails on high or critical.
# It never blocks commits: it runs on a schedule, on demand, and when the lockfile changes.
name: Dependency audit

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC (08:00 in Mexico City)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bun.lock]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2
      # Reads bun.lock directly; no install needed.
      # Accepted exceptions: build-time tooling only (Expo CLI, Metro, Babel/Jest),
      # never in the app bundle or on a server with untrusted input. Review them on
      # every Expo SDK upgrade and drop each --ignore once a fixed version lands.
      #   GHSA-86w9-cpqp-85rv node-forge 1.4.0 (@expo/cli 57 dev server): no fix published
      #   GHSA-mrhx-c7xc-m3w5 zod 3.25.76 (@expo/cli 57 build tooling): zod 3 has no fix and
      #     @expo/cli 58 still needs ^3.25.76. bun ignores a GHSA for every copy, so
      #     scripts/dependency-audit-exceptions.test.ts fails if any other zod drops below 4.6.6.
      - run: >-
          bun audit --audit-level=high
          --ignore=GHSA-86w9-cpqp-85rv
          --ignore=GHSA-mrhx-c7xc-m3w5
