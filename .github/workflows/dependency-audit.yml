# Weekly dependency vulnerability audit.
# Dependabot alerts only see direct dependencies in package.json; bun audit reads
# bun.lock, so it also covers transitive dependencies. Fails on high or critical.
# It never blocks commits: it runs on a schedule, on demand, and when the lockfile changes.
name: Dependency audit

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs under load,
    # most often at minute 0.
    - cron: '17 14 * * 1' # Mondays 14:17 UTC (08:17 in Mexico City)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bun.lock]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Reads bun.lock directly; no install needed.
      # No accepted exceptions. An exception is an --ignore=<GHSA> flag with its reason
      # in a comment here (docs/dependencies.md, "An override would be unsafe"), and
      # scripts/dependency-audit-exceptions.test.ts checks that every flag has one.
      - run: bun audit --audit-level=high
