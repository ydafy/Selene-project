# CI: lint, format check, typecheck and the bun test suite, plus the pgTAP database tests
# against a local Supabase stack started inside the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Prettier on every file, not only the staged ones lint-staged formats.
      - run: bun run format:check
      # Unused files, exports and dependencies in apps/frontend (knip.jsonc).
      - run: bun run knip
      # `expo start` writes this gitignored file locally; without it the frontend
      # typecheck runs without Expo's types and misses errors developers see (#174).
      - name: Write apps/frontend/expo-env.d.ts
        run: echo '/// <reference types="expo/types" />' > apps/frontend/expo-env.d.ts
      - run: bun run typecheck
      # Edge Functions run on Deno, which `bun run typecheck` does not cover.
      # --frozen also fails when supabase/functions/deno.lock is out of date.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.6.6
      - name: deno check Edge Functions
        working-directory: supabase/functions
        run: deno check --frozen */index.ts
      - run: bun test

  # Every commit of the pull request goes through scripts/check-commit-msg.ts,
  # so a commit made with --no-verify or in a clone without hooks still fails.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/check-commit-msg.ts --range "$BASE_SHA..$HEAD_SHA"

  # pgTAP files in supabase/tests/database/ (`bun run test:db`). The stack is
  # local to the runner; this job never reaches the remote project.
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same CLI version as the maintainer's machine; bump them together.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - run: supabase start
      - run: supabase test db
