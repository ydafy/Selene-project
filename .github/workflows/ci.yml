# CI: lint, format check, typecheck and the bun test suite, the pgTAP database tests
# against a local Supabase stack started inside the job, the admin-web Playwright specs,
# and actionlint and zizmor on the workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No job pushes or fetches after checkout, so none keeps the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Prettier on every file, not only the staged ones lint-staged formats.
      - run: bun run format:check
      # Unused files, exports and dependencies in apps/frontend and apps/admin-web (knip.jsonc).
      - run: bun run knip
      # `expo start` writes this gitignored file locally; without it the frontend
      # typecheck runs without Expo's types and misses errors developers see (#174).
      - name: Write apps/frontend/expo-env.d.ts
        run: echo '/// <reference types="expo/types" />' > apps/frontend/expo-env.d.ts
      - run: bun run typecheck
      # Edge Functions run on Deno, which `bun run typecheck` does not cover.
      # --frozen also fails when supabase/functions/deno.lock is out of date.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.6.6
      - name: deno check Edge Functions
        working-directory: supabase/functions
        run: deno check --frozen ./*/index.ts
      - run: bun test

  # actionlint and zizmor on .github/workflows/. Both are release binaries pinned by
  # version and sha256 (docs/dependencies.md, "Keep the workflow linters current").
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        id: install
        shell: bash
        run: |
          set -euo pipefail
          # actionlint puts the version in its archive name; zizmor's name never
          # changes, so a zizmor bump only changes ZIZMOR_VERSION and ZIZMOR_SHA256.
          actionlint_tar="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          zizmor_tar=zizmor-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$actionlint_tar" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_tar}"
          curl -fsSL --retry 3 -o "$zizmor_tar" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${zizmor_tar}"
          echo "${ACTIONLINT_SHA256}  ${actionlint_tar}" | sha256sum -c -
          echo "${ZIZMOR_SHA256}  ${zizmor_tar}" | sha256sum -c -
          mkdir -p bin
          tar -xzf "$actionlint_tar" -C bin actionlint
          tar -xzf "$zizmor_tar" -C bin zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # shellcheck is preinstalled on ubuntu-latest; actionlint runs it on every run: script.
      - run: actionlint
      # Also runs after an actionlint failure, so one push shows both results,
      # but not after a failed install, where it could only add "command not found".
      - name: zizmor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --format github .github/workflows

  # Every commit of the pull request goes through scripts/ci/check-commit-msg.ts,
  # so a commit made with --no-verify or in a clone without hooks still fails.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci/check-commit-msg.ts --range "$BASE_SHA..$HEAD_SHA"

  # pgTAP files in supabase/tests/database/ (`bun run test:db`). The stack is
  # local to the runner; this job never reaches the remote project.
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Depth 2 keeps the first parent of the pull request's merge commit, the
      # base the migration lint diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Same CLI version as the maintainer's machine; bump them together.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - run: supabase start
      - run: supabase test db
      # Bun and the install also run after a pgTAP failure, so the final gates
      # below still have bun and squawk-cli.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() }}
      # supabase/schemas/ must describe the same database as supabase/migrations/.
      # The check script imports nothing from node_modules, so no install step.
      - run: bun run db:schema:check
      # packages/types/src/database.types.ts must be what the migrations generate.
      # The check formats with the repository's Prettier, so it needs the install.
      - run: bun install --frozen-lockfile
        if: ${{ !cancelled() }}
      - run: bun run db:types:check
      # The scripts/verify/ harnesses that need only this stack, in sequence
      # (scripts/verify/run-harnesses.ts lists the groups; about 20 s).
      - run: bun run verify:harnesses --group pr
      # The two static database gates run last and even after an earlier step
      # failed, so one push shows every result.
      # Squawk on the migrations the pull request adds (.squawk.toml;
      # supabase/AGENTS.md, "Migration lint"). The checkout is the merge commit,
      # and its first parent is the base branch as it is now.
      - name: Lint new migrations
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: bun run db:lint:migrations --base HEAD^1
      # Security advisor findings beyond scripts/ci/security-advisor-exceptions.ts.
      - name: Check security advisors
        if: ${{ !cancelled() }}
        run: bun run db:advisors:check

  # Playwright specs in e2e/admin-web/ (`bun run test:e2e`). Every backend call
  # is mocked, so the job needs no stack and no secrets; playwright.config.ts
  # passes placeholder VITE_* values to the Vite dev server.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      # A test that passed on a retry is flaky: keep its report and the trace of
      # the failed attempt too, not only on failure (#345). playwright.config.ts
      # writes the JSON report on CI.
      - name: Detect flaky tests
        id: flaky
        run: echo "found=$(jq '.stats.flaky > 0' test-results/results.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
