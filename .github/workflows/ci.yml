# Minimal CI: the same test suite the pre-commit hook runs.
# Lint and typecheck are not gated yet because both have baseline failures on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Bun version comes from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Edge Functions run on Deno, which `bun run typecheck` does not cover.
      # --frozen also fails when supabase/functions/deno.lock is out of date.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.6.6
      - name: deno check Edge Functions
        working-directory: supabase/functions
        run: deno check --frozen */index.ts
      - run: bun test
