strict_tdd: true
context: |
  Selene monorepo — marketplace for used PC hardware in Mexico.
  Runtime: Bun v1.3.11. TypeScript strict across all packages.
  Monorepo with workspaces: apps/frontend (Expo RN), apps/admin-web (React+Vite+Tailwind),
  apps/backend (Express), packages/types (shared), supabase/functions (Edge Functions).
  External services: Stripe (payments, Connect), Envia (shipping), Supabase (BaaS).
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: bun test
  verify:
    test_command: bun test
testing:
  detected: '2026-05-27'
  strict_tdd: true
  runner:
    command: bun test
    framework: bun:test
  layers:
    unit: bun:test
    integration: ''
    e2e: ''
  commands:
    unit:
      - scope: '.'
        command: bun test
        framework: bun:test
    integration: []
    e2e: []
  coverage:
    available: true
    command: bun test --coverage
quality:
  lint: bun run lint
  lint_commands:
    - scope: '.'
      command: bun run lint
      framework: eslint
    - scope: apps/admin-web
      command: cd apps/admin-web && npm run lint
      framework: eslint
  typecheck: tsc -b (per workspace, no root command)
  typecheck_commands:
    - scope: apps/frontend
      command: cd apps/frontend && bunx tsc --noEmit
      framework: typescript
    - scope: apps/admin-web
      command: cd apps/admin-web && bunx tsc -b
      framework: typescript
    - scope: apps/backend
      command: cd apps/backend && bunx tsc --noEmit
      framework: typescript
    - scope: packages/types
      command: cd packages/types && bunx tsc --noEmit
      framework: typescript
  format: bun run format
  format_commands:
    - scope: '.'
      command: bun run format
      framework: prettier
